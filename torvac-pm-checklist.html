<title>Torvac Vacuum Furnace PM Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a08;
    --surface: #141009;
    --surface2: #1a1410;
    --border: #2e2318;
    --accent: #ff6b1a;
    --accent2: #ffb347;
    --cool: #4fc3f7;
    --warn: #ffdd57;
    --danger: #ff3b3b;
    --ok: #4cde8a;
    --text: #d4c4b0;
    --text-dim: #6b5a47;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow Condensed', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(255,107,26,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(255,179,71,0.04) 0%, transparent 55%);
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    background: rgba(255,107,26,0.03);
  }

  .header-left h1 {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    line-height: 1;
  }

  .header-left h1 span { color: var(--accent); }

  .header-left p {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 0.12em;
  }

  .header-meta {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }

  .field-wrap {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .field-wrap label {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  select, input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
  }

  select:focus, input[type="text"]:focus { border-color: var(--accent); }

  .btn {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;

            title: '🔴 Controller Fault — Do Not Run Blind',
            body: 'A faulty temperature controller can allow the furnace to overheat without alarm.\n• Check all wiring connections to the controller\n• Verify TC input signal is reaching the controller correctly\n• Attempt controller reset or factory restore if available\n• If controller output is erratic, the SSR or SCR power module may be failing — check with a clamp meter\n• Do not run production until control system is verified'
          }
        }
      },
      {
        label: 'Check wiring, terminals, and contactors for loose connections or heat damage',
        crit: 'med',
        sub: 'Inspect accessible terminal blocks and contactors in the control panel. Look for discoloration.',
        solution: {
          pass: 'All terminals are tight with no discoloration or heat damage observed.',
          fail: {
            title: '🔴 Repair Electrical Faults — Contact Qualified Electrician',
            body: 'Loose terminals cause resistance heating which can start fires or cause intermittent faults.\n• Tighten any loose connections — if in doubt, call a qualified electrician\n• Discolored terminals indicate a history of overheating — the wire and terminal should be replaced, not just retightened\n• Check contactor contacts for pitting or burning — replace if worn\n• Document and log all electrical findings'
          }
        }
      }
    ]
  },
  {
    icon: '🧹',
    title: 'General Condition & Safety',
    items: [
      {
        label: 'Perform bake-out cycle after any maintenance involving the hot zone',
        crit: 'high',
        sub: 'Ramp to ~400–600°C under vacuum to outgas chamber before production runs.',
        solution: {
          pass: 'Bake-out completed and vacuum level returned to baseline after cool-down.',
          fail: {
            title: '🔴 Bake-Out Required Before Production',
            body: 'Any maintenance that exposes the hot zone to atmosphere introduces moisture and organic contamination that will outgas during a production run and degrade the process.\n• Run a bake-out ramp to 400–600°C (or per your SOP) under vacuum\n• Hold temperature until vacuum level recovers to baseline — typically 1–2 hours\n• Do not skip bake-out after O-ring replacement, cleaning, or any hot zone work\n• Log bake-out completion and final vacuum level reached'
          }
        }
      },
      {
        label: 'Inspect external furnace body, door mechanism, and hinges',
        crit: 'med',
        sub: 'Check door opens and closes smoothly; hinges are lubricated; locking mechanism engages fully.',
        solution: {
          pass: 'Door operates smoothly, hinges move freely, locking mechanism engages fully and evenly.',
          fail: {
            title: '🔴 Service Door Mechanism',
            body: 'A stiff or misaligned door puts uneven pressure on the O-ring sealing face, causing leaks.\n• Lubricate hinges with appropriate grease\n• Check door alignment — many furnaces have adjustment bolts for the door closure\n• Inspect locking handles/clamps for wear — worn clamps cannot generate enough closing force\n• If door is significantly misaligned, contact the manufacturer for adjustment guidance'
          }
        }
      },
      {
        label: 'Check safety interlocks — over-temperature, water flow, and vacuum interlocks',
        crit: 'high',
        sub: 'Test each interlock by simulating the fault condition where safely possible.',
        solution: {
          pass: 'All interlocks tested and confirmed to respond correctly — furnace shuts down or alarms as expected.',
          fail: {
            title: '🔴 Do Not Operate With Non-Functioning Safety Interlock',
            body: 'Safety interlocks protect against catastrophic failure scenarios.\n• Over-temperature interlock failure: check the independent over-temperature controller and its TC wiring\n• Water flow interlock failure: check flow switch, wiring, and the PLC/relay logic\n• Vacuum interlock failure: check TC gauge, relay, and wiring\n• Any interlock that cannot be restored to correct function must be escalated to engineering immediately — the furnace should not run without all safety interlocks functioning'
          }
        }
      },
      {
        label: 'Verify all safety labels, SOP references, and warning signs are legible and present',
        crit: 'med',
        sub: 'Check for hot surface, high voltage, stored energy, and vacuum hazard labels.',
        solution: {
          pass: 'All required labels are present, legible, and correctly positioned.',
          fail: {
            title: '🟡 Replace Missing or Damaged Labels',
            body: 'Replace any missing or illegible safety labels before next operation. Print replacements from your site safety label system or contact your safety officer. High voltage and hot surface warnings are mandatory. Log the finding.'
          }
        }
      },
      {
        label: 'Complete PM log entry and sign off',
        crit: 'med',
        sub: 'Record unit ID, date, technician, all findings, corrective actions taken, and next PM due date.',
        solution: {
          pass: 'PM record completed, signed, and filed in maintenance log. Next PM date scheduled.',
          fail: {
            title: '🟡 Complete the PM Record',
            body: 'A PM without a record is not a PM from a compliance standpoint. Complete the log with all findings, actions taken, parts replaced, and any items outstanding. Note escalations. Confirm next PM due date is scheduled in the maintenance system.'
          }
        }
      }
    ]
  }
];

const state = {};

function initState() {
  SECTIONS.forEach((sec, si) => {
    sec.items.forEach((_, ii) => {
      const key = `${si}-${ii}`;
      if (!state[key]) state[key] = { status: 'pending', note: '' };
    });
  });
}

function renderSections() {
  const main = document.getElementById('mainContent');
  main.querySelectorAll('.section').forEach(el => el.remove());
  const banner = document.getElementById('completeBanner');

  SECTIONS.forEach((sec, si) => {
    const div = document.createElement('div');
    div.className = 'section';
    div.id = `sec-${si}`;

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `
      <span class="section-icon">${sec.icon}</span>
      <span class="section-title">${sec.title}</span>
      <span class="section-count" id="sec-count-${si}">0/${sec.items.length}</span>
      <span class="section-chevron">▼</span>
    `;
    hdr.addEventListener('click', () => div.classList.toggle('collapsed'));
    div.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'section-body';

    sec.items.forEach((item, ii) => {
      const key = `${si}-${ii}`;
      const s = state[key];
      const statusClass = s.status === 'pass' ? 'checked' : s.status === 'fail' ? 'flagged' : s.status === 'warn' ? 'warn' : '';
      const checkSymbol = s.status === 'pass' ? '✓' : s.status === 'fail' ? '✕' : s.status === 'warn' ? '!' : '';
      const critBadge = item.crit === 'high'
        ? '<span class="crit-badge crit-high">Critical</span>'
        : item.crit === 'med'
        ? '<span class="crit-badge crit-med">Important</span>'
        : '';

      const warnTag = item.solution.warn
        ? `<span class="tag tag-warn" onclick="event.stopPropagation();setStatus('${key}','warn')">! Monitor</span>`
        : '';

      const itemDiv = document.createElement('div');
      itemDiv.className = `check-item ${statusClass}`;
      itemDiv.id = `item-${key}`;
      itemDiv.innerHTML = `
        <div class="check-row" onclick="toggleSolution('${key}')">
          <div class="check-box">${checkSymbol}</div>
          <div class="check-content">
            <div class="check-label">${item.label}${critBadge}</div>
            <div class="check-sub">${item.sub}</div>
            <div class="check-actions">
              <span class="tag tag-pass" onclick="event.stopPropagation();setStatus('${key}','pass')">✓ Pass</span>
              <span class="tag tag-fail" onclick="event.stopPropagation();setStatus('${key}','fail')">✕ Issue</span>
              ${warnTag}
              <span class="tag tag-info" onclick="event.stopPropagation();toggleSolution('${key}')">ℹ Solution</span>
            </div>
          </div>
        </div>
        <div class="solution-panel ${getSolutionClass(s.status)}" id="sol-${key}">
          ${getSolutionHTML(item, s.status)}
        </div>
        <div class="notes-row">
          <input type="text" placeholder="Notes / observations..." value="${s.note}" oninput="saveNote('${key}',this.value)">
        </div>
      `;
      body.appendChild(itemDiv);
    });

    div.appendChild(body);
    main.insertBefore(div, banner);
  });

  updateProgress();
}

function getSolutionClass(status) {
  if (status === 'fail') return 'danger-panel visible';
  if (status === 'warn') return 'warn-panel visible';
  if (status === 'pass') return 'pass-panel visible';
  return '';
}

function getSolutionHTML(item, status) {
  if (status === 'pass' && item.solution.pass) {
    return `<h4>✔ Pass Confirmed</h4><p>${item.solution.pass}</p>`;
  }
  if (status === 'fail' && item.solution.fail) {
    return `<h4>${item.solution.fail.title}</h4><p style="white-space:pre-line">${item.solution.fail.body}</p>`;
  }
  if (status === 'warn' && item.solution.warn) {
    return `<h4>${item.solution.warn.title}</h4><p>${item.solution.warn.body}</p>`;
  }
  // Pending — show all guidance
  let html = '';
  if (item.solution.pass) html += `<h4>✔ Pass Criteria</h4><p>${item.solution.pass}</p>`;
  if (item.solution.fail) html += `<h4 style="margin-top:10px">${item.solution.fail.title}</h4><p style="white-space:pre-line">${item.solution.fail.body}</p>`;
  if (item.solution.warn) html += `<h4 style="margin-top:10px">${item.solution.warn.title}</h4><p>${item.solution.warn.body}</p>`;
  return html;
}

function toggleSolution(key) {
  const panel = document.getElementById(`sol-${key}`);
  panel.classList.toggle('visible');
}

function setStatus(key, status) {
  const [si, ii] = key.split('-').map(Number);
  const item = SECTIONS[si].items[ii];
  state[key].status = status;

  const itemDiv = document.getElementById(`item-${key}`);
  itemDiv.className = `check-item ${status === 'pass' ? 'checked' : status === 'fail' ? 'flagged' : status === 'warn' ? 'warn' : ''}`;

  const box = itemDiv.querySelector('.check-box');
  box.textContent = status === 'pass' ? '✓' : status === 'fail' ? '✕' : status === 'warn' ? '!' : '';

  const panel = document.getElementById(`sol-${key}`);
  panel.className = `solution-panel ${getSolutionClass(status)}`;
  panel.innerHTML = getSolutionHTML(item, status);

  updateProgress();
}

function saveNote(key, val) { state[key].note = val; }

function updateProgress() {
  let pass = 0, fail = 0, warn = 0, total = 0;

  SECTIONS.forEach((sec, si) => {
    let secDone = 0;
    sec.items.forEach((_, ii) => {
      const s = state[`${si}-${ii}`].status;
      total++;
      if (s === 'pass') { pass++; secDone++; }
      else if (s === 'fail') { fail++; secDone++; }
      else if (s === 'warn') { warn++; secDone++; }
    });
    const el = document.getElementById(`sec-count-${si}`);
    if (el) el.textContent = `${secDone}/${sec.items.length}`;
  });

  const done = pass + fail + warn;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('statPass').textContent = pass;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('statWarn').textContent = warn;
  document.getElementById('statTotal').textContent = total;

  const banner = document.getElementById('completeBanner');
  if (done === total && total > 0) {
    banner.classList.add('visible');
    const tech = document.getElementById('techName').value || 'Technician';
    const machine = document.getElementById('machineSelect').value;
    const date = document.getElementById('pmDate').value;
    document.getElementById('completeText').textContent =
      `${machine} — ${tech} — ${date} | Pass: ${pass} | Issues: ${fail} | Monitor: ${warn}`;
  } else {
    banner.classList.remove('visible');
  }
}

function resetAll() {
  if (!confirm('Reset all checks? This cannot be undone.')) return;
  Object.keys(state).forEach(k => { state[k] = { status: 'pending', note: '' }; });
  renderSections();
}

function printReport() {
  const machine = document.getElementById('machineSelect').value;
  const tech = document.getElementById('techName').value || '—';
  const date = document.getElementById('pmDate').value || '—';

  let rows = '';
  let issueCount = 0;
  SECTIONS.forEach((sec, si) => {
    sec.items.forEach((item, ii) => {
      const key = `${si}-${ii}`;
      const s = state[key];
      const statusLabel = s.status === 'pass' ? '✓ PASS' : s.status === 'fail' ? '✕ ISSUE' : s.status === 'warn' ? '! MONITOR' : '— PENDING';
      const critLabel = item.crit === 'high' ? 'Critical' : item.crit === 'med' ? 'Important' : '';
      if (s.status === 'fail') issueCount++;
      rows += `<tr>
        <td>${sec.title}</td>
        <td>${item.label}</td>
        <td style="font-size:11px;color:#777">${critLabel}</td>
        <td style="color:${s.status==='pass'?'#008844':s.status==='fail'?'#cc1122':s.status==='warn'?'#cc7700':'#888'};font-weight:bold">${statusLabel}</td>
        <td>${s.note || ''}</td>
      </tr>`;
    });
  });

  const html = `<!DOCTYPE html><html><head><title>Torvac Vacuum Furnace PM Report</title>
  <style>
    body{font-family:Arial,sans-serif;padding:24px;color:#222;font-size:13px}
    h2{margin-bottom:4px;font-size:18px}
    .meta{margin:4px 0;color:#555;font-size:12px}
    .summary{margin:12px 0;padding:10px 14px;background:#f5f5f5;border-left:4px solid #cc4400;font-size:12px}
    table{width:100%;border-collapse:collapse;margin-top:16px}
    th{background:#1a1208;color:#fff;padding:8px;text-align:left;font-size:11px;letter-spacing:0.05em}
    td{padding:7px 8px;font-size:11px;border-bottom:1px solid #e0e0e0;vertical-align:top}
    tr:nth-child(even)td{background:#fafafa}
    .footer{margin-top:16px;font-size:10px;color:#aaa;border-top:1px solid #eee;padding-top:8px}
  </style></head><body>
  <h2>Torvac Vacuum Furnace — Preventive Maintenance Report</h2>
  <p class="meta"><strong>Unit:</strong> ${machine} &nbsp;|&nbsp; <strong>Technician:</strong> ${tech} &nbsp;|&nbsp; <strong>Date:</strong> ${date}</p>
  ${issueCount > 0 ? `<div class="summary">⚠ <strong>${issueCount} issue(s) flagged</strong> during this PM. Corrective action required before return to production where indicated.</div>` : '<div class="summary" style="border-left-color:#008844">✔ No issues flagged during this PM.</div>'}
  <table><thead><tr><th>Section</th><th>Check Item</th><th>Priority</th><th>Status</th><th>Notes / Actions Taken</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <div class="footer">Generated by Torvac Vacuum Furnace PM Checklist &nbsp;|&nbsp; ${date}</div>
  </body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  setTimeout(() => win.print(), 500);
}

// Set today's date
const today = new Date();
document.getElementById('pmDate').value = today.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});

initState();
renderSections();
</script>
</body>
</html>
